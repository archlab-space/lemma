[project]
name = "backend"
version = "0.1.0"
description = "Lemma AI-Powered Academic Paper Analysis Platform - Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "structlog>=25.4.0",
    "uvicorn[standard]>=0.35.0",
    "rich>=14.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "httpx[socks]>=0.28.1",
    "asyncpg>=0.30.0",
    "supabase>=2.18.1",
    "pydantic-settings>=2.10.1",
    "pydantic[email]>=2.11.9",
    # PDF Processing
    "pymupdf>=1.26.4",
    "python-magic>=0.4.27",
    "pillow>=11.3.0",
    # AI/LLM Integration
    "litellm>=1.77.3",
    # Object Storage (S3/R2)
    "aioboto3>=15.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = []
